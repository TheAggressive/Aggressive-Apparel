version: 2

# Every third-party action in .github/workflows is pinned to a full commit SHA,
# which bin/ci/contracts.mjs enforces. Pinning without automated bumps rots:
# the pin is what stops a compromised tag from executing, but it is also what
# keeps a known-vulnerable version in place indefinitely. Dependabot rewrites
# the SHA and the trailing version comment together, so review stays readable.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    commit-message:
      # `chore` deliberately: CI tooling bumps must not cut a theme release.
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    # `allow.update-types` limits scheduled version updates only. Unlike
    # `ignore`, it does not suppress a security fix that must cross a major.
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-actions:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - javascript
    # Scheduled majors are intentionally quiet. `allow.update-types` applies
    # only to version updates; security updates still open even when the minimum
    # patched version crosses a major. Broad `ignore` rules cannot provide that
    # separation because GitHub also applies them to security updates.
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      wordpress:
        applies-to: version-updates
        patterns:
          - '@wordpress/*'
        update-types:
          - minor
          - patch
      dev-tooling:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@wordpress/*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - php
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      php-tooling:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
