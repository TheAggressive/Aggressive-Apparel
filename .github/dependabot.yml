version: 2

# Every third-party action in .github/workflows is pinned to a full commit SHA,
# which bin/ci/contracts.mjs enforces. Routine version maintenance is kept
# monthly and grouped; security updates remain separately grouped and eligible.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
    commit-message:
      # `chore` deliberately: CI tooling bumps must not cut a theme release.
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    # `allow.update-types` limits scheduled version updates only. It does not
    # suppress a security fix that must cross a major.
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-actions:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - javascript
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      wordpress:
        applies-to: version-updates
        patterns:
          - '@wordpress/*'
        update-types:
          - minor
          - patch
      dev-tooling:
        applies-to: version-updates
        patterns:
          - '*'
        exclude-patterns:
          - '@wordpress/*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - php
    allow:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      php-tooling:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
