name: Dependabot auto-merge

# Squash-merges Dependabot dependency updates once the full pipeline has passed,
# so routine minor/patch bumps stop being a weekly chore.
#
# `workflow_run` provides the policy layer before GitHub's built-in auto-merge:
# it verifies the completed pipeline, re-checks every PR status, and rejects
# major updates before registering the merge. Branch protection then waits for
# the independent code-owner approval.
#
# Four independent conditions must hold before anything merges. Any one of them
# failing leaves the pull request untouched for a human:
#
#   1. The triggering run was the pipeline, on a pull request, and it succeeded.
#   2. The pull request author is genuinely dependabot[bot], re-checked against
#      the API rather than trusted from the event payload.
#   3. EVERY check on the pull request is green — not just the run that fired
#      this workflow. A pending or failed CodeQL still blocks the merge.
#   4. The update does not cross a major version. Majors are already excluded in
#      dependabot.yml, so this is defence in depth: a config change alone should
#      never be enough to start auto-merging majors.

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]

# Read-only by default; the merge job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: 🤖 Auto-merge Dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge if every check passed and no major version is crossed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Resolve the pull request from the branch. workflow_run's
          # `pull_requests` array is unreliable, so look it up explicitly.
          PR="$(gh pr list --head "${HEAD_BRANCH}" --state open \
                  --json number --jq '.[0].number // empty')"
          if [[ -z "${PR}" ]]; then
            echo "No open pull request for ${HEAD_BRANCH} — nothing to do."
            exit 0
          fi

          # Re-verify authorship server-side. The event payload is not enough:
          # only a real Dependabot pull request may be merged unattended.
          AUTHOR="$(gh pr view "${PR}" --json author --jq '.author.login')"
          if [[ "${AUTHOR}" != "app/dependabot" && "${AUTHOR}" != "dependabot[bot]" ]]; then
            echo "::notice::#${PR} is authored by ${AUTHOR}, not Dependabot. Leaving it."
            exit 0
          fi

          TITLE="$(gh pr view "${PR}" --json title --jq '.title')"

          # Defence in depth on major versions. Individual bumps carry their
          # versions in the title ("bump X from 1.2.3 to 2.0.0"); grouped bumps
          # do not, and are constrained to minor/patch by dependabot.yml.
          if [[ "${TITLE}" =~ from\ ([0-9]+)\.[0-9]+\.[0-9]+.*\ to\ ([0-9]+)\.[0-9]+\.[0-9]+ ]]; then
            FROM_MAJOR="${BASH_REMATCH[1]}"
            TO_MAJOR="${BASH_REMATCH[2]}"
            if [[ "${FROM_MAJOR}" != "${TO_MAJOR}" ]]; then
              echo "::notice::#${PR} crosses a major version (${FROM_MAJOR} -> ${TO_MAJOR}). Leaving it for review."
              exit 0
            fi
          elif [[ ! "${TITLE}" =~ bump\ the\ .*\ group ]]; then
            echo "::notice::#${PR} title is not a recognised Dependabot form. Leaving it."
            exit 0
          fi

          # Require EVERY check to be green, not just the run that fired this
          # workflow. Anything still pending means we do not yet know.
          STATES="$(gh pr view "${PR}" --json statusCheckRollup \
                      --jq '[.statusCheckRollup[] | (.conclusion // .status // "PENDING")] | join(" ")')"
          echo "Checks on #${PR}: ${STATES}"

          for state in ${STATES}; do
            case "${state}" in
              SUCCESS|SKIPPED|NEUTRAL|COMPLETED) ;;
              *)
                echo "::notice::#${PR} has a check in state ${state}. Not merging."
                exit 0
                ;;
            esac
          done

          echo "All checks green on #${PR} — enabling squash auto-merge."
          # Branch protection still requires an independent code-owner review.
          # --auto records the intent and lets GitHub merge only after that final
          # governance requirement is satisfied.
          gh pr merge "${PR}" --auto --squash --delete-branch
