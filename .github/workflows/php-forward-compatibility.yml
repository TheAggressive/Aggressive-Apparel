name: PHP Forward Compatibility

# The release gate and the development environment both run the supported PHP
# floor on purpose — that parity is what stops an API missing on the floor from
# passing locally and failing in Actions. The cost is that nothing exercises
# newer PHP, so deprecations would first surface when a host upgrades. This job
# buys that coverage back without letting either environment disagree with the
# gate.
#
# Scheduled and manual only: it must never gate a release, because a deprecation
# on a version the theme does not claim to support is information, not a defect.

on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-forward-compatibility
  cancel-in-progress: false

env:
  NODE_VERSION: '24.18.0'

jobs:
  php:
    name: 🔮 PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # One version failing must not hide the result of the others.
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The PHP lane needs compiled assets present for the integration suites.
      - name: Run canonical build lane
        run: pnpm ci:build

      - name: Run PHP lane on ${{ matrix.php }}
        run: pnpm ci:php:forward ${{ matrix.php }}
