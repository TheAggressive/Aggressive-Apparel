name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Releasing is a decision, not a side effect of merging. Every push to master
  # still runs the full quality pipeline; only this input reaches the publishing
  # path, so several merges can ship as one update instead of one each.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Cut a release from master if the merged commits warrant one'
        type: boolean
        default: false

permissions:
  contents: read

# Superseded PR pushes are cancelled, but a release-branch run is allowed to
# finish its draft creation, remote verification and promotion as one operation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.0'

jobs:
  # ============================================================================
  # Classify the diff so a lane only runs when the change could affect it.
  #
  # `code` — anything outside languages/. A translations-only merge (the i18n MT
  # pull request) leaves it false, which skips the frontend job and cascade-skips
  # build → test → package. Those translations ship with the next release, whose
  # package step recompiles the .mo from whatever catalogs are on master.
  #
  # `docs_only` — the diff is nothing but Markdown. Prose cannot change built
  # output, shift a POT source reference, or alter behaviour, so the i18n gate
  # skips and cascade-skips build → PHP → browser E2E with it. Linting still
  # runs. Note this is deliberately narrower than it could be: workflow-only
  # changes still run everything, because a workflow edit must be exercised by
  # the pipeline it edits.
  #
  # A manual run has no diff to read, so it answers for itself: dispatch is
  # either a release or a deliberate re-verification, and both need every lane.
  # ============================================================================
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      code: ${{ steps.decide.outputs.code }}
      docs_only: ${{ steps.decide.outputs.docs_only }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # `code` matches when any changed file is outside languages/.
          # `non_docs` matches when any changed file is NOT Markdown; its absence
          # is what proves a diff is documentation only. Asking the question in
          # that direction means an unmatched new file type counts as code,
          # rather than being silently classified as prose and skipping lanes.
          filters: |
            code:
              - '**'
              - '!languages/**'
            non_docs:
              - '**'
              - '!**/*.md'

      - name: Decide which lanes are required
        id: decide
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_NON_DOCS: ${{ steps.filter.outputs.non_docs }}
        run: |
          set -euo pipefail

          if [[ "${IS_DISPATCH}" == "true" ]]; then
            code=true
            docs_only=false
          else
            code="${FILTER_CODE}"
            # Only Markdown changed when nothing outside Markdown did. An empty
            # filter output means the step did not run, which must never read as
            # "documentation only" — fail closed to the expensive answer.
            if [[ "${FILTER_NON_DOCS}" == "false" ]]; then
              docs_only=true
            else
              docs_only=false
            fi
          fi

          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "code=${code} docs_only=${docs_only}"

  # ============================================================================
  # PARALLEL: Release planning.
  #
  # semantic-release intentionally verifies push permission even in dry-run
  # mode. Keep that write-capable token isolated from build and test jobs, run
  # only for trusted pushes to a release branch, and fail closed if planning
  # itself errors. This job runs alongside linting, so it does not extend the
  # pipeline's critical path.
  # ============================================================================
  release-plan:
    name: 🧮 Plan Release
    runs-on: ubuntu-24.04
    needs: changes
    # Only a deliberate publish reaches this job, so merging a fix no longer
    # ships an update on its own. Everything downstream of it — package,
    # acceptance, release, version-sync — skips with it on an ordinary push,
    # because a skipped dependency skips its dependents.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish &&
      github.ref == 'refs/heads/master'
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Lifecycle scripts are unnecessary for release analysis. Disabling them
      # reduces what can execute while this job holds its scoped write token.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  # ============================================================================
  # PARALLEL: Quality Checks (no setup dependency — each job self-caches)
  # ============================================================================
  lint-frontend:
    name: 🔍 Lint & Test Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install gettext for PO validator tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gettext

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical frontend lane
        run: pnpm ci:frontend

  # ============================================================================
  # Supply chain: block a pull request that introduces a dependency with a known
  # advisory, before it reaches the tree. `pnpm audit` in the frontend lane only
  # sees what is already installed; this reviews the diff itself.
  # ============================================================================
  dependency-review:
    name: 🛡️ Dependency Review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ============================================================================
  # i18n: POT drift + PO validity + translators-comment lint
  # ============================================================================
  i18n:
    name: 🌐 i18n Check
    runs-on: ubuntu-24.04
    needs: changes
    # Markdown holds no translatable strings and cannot shift a POT source
    # reference, so a prose-only diff has nothing for this lane to check. `build`
    # depends on this job, so skipping here also skips build → PHP → E2E.
    if: needs.changes.outputs.docs_only != 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical i18n lane
        run: pnpm ci:i18n

  # ============================================================================
  # Build Assets. On the translations-only path its lint deps skip, which
  # cascade-skips this job (and test/package/release) — a .po merge never
  # rebuilds. On the code path it runs so tests have artifacts.
  # ============================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-24.04
    needs: [lint-frontend, i18n]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical build lane
        run: pnpm ci:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # ============================================================================
  # PHP quality + tests: syntax, PHPCS, PHPStan and every PHPUnit suite run in
  # the same committed PHP 8.2 wp-env lane locally and in Actions.
  # Runs in parallel with the browser E2E job after both consume the same build.
  # ============================================================================
  test:
    name: 🧪 PHP Quality & Tests
    runs-on: ubuntu-24.04
    # build cascade-skips on the translations-only path, so this 15-min wp-env
    # suite skips with it — no explicit gate needed. Browser tests run in a
    # sibling job so they do not extend this job's critical path.
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Run canonical PHP lane
        run: pnpm ci:php

      # Reporting only — the PHP lane above is the gate. A Codecov outage or a
      # missing token on a fork PR must not fail a run whose tests all passed.
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage-unit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Browser E2E: Runs beside PHP tests and reuses the build job's artifacts.
  # The shared CI lane avoids the public local E2E command's rebuild because the
  # build job already produced and uploaded the exact assets under test.
  # ============================================================================
  e2e:
    name: 🎭 Browser E2E
    runs-on: ubuntu-24.04
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile bump usually does not change the browser build, so fall
          # back to the most recent cache instead of re-downloading Chromium.
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run end-to-end tests
        run: pnpm ci:e2e

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================================================
  # Package Theme
  # ============================================================================
  package:
    name: 📦 Package Theme
    runs-on: ubuntu-24.04
    needs: [release-plan, build, test, e2e]
    if: success() && needs.release-plan.outputs.should_release == 'true'
    # Matches the `test` job: this lane also brings up wp-env from cold to
    # compile catalogs with the pinned WP-CLI.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      # Compiles catalogs, builds the ZIP from the allowlist in
      # bin/release/lib.sh, then asserts contents, exclusions, catalogs and
      # headers. Identical to what `pnpm qa` runs locally.
      - name: Run canonical package lane
        env:
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:package

      - name: Upload theme package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-package
          path: |
            aggressive-apparel-${{ needs.release-plan.outputs.next_version }}.zip
            aggressive-apparel-${{ needs.release-plan.outputs.next_version }}.zip.sha256
          retention-days: 30

  # Install the exact release ZIP into a WordPress environment with no checkout
  # mapping. Source-tree E2E cannot prove that a standalone archive activates.
  artifact-acceptance:
    name: 🧳 Release Artifact Acceptance
    runs-on: ubuntu-24.04
    needs: [release-plan, package]
    if: success() && needs.release-plan.outputs.should_release == 'true'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download final theme package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-package
          path: ./

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run canonical artifact acceptance lane
        env:
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: pnpm ci:artifact

      - name: Upload artifact-smoke diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================================================
  # Release (Only on master)
  # ============================================================================
  release:
    name: 🚀 Release
    runs-on: ubuntu-24.04
    needs: [release-plan, package, artifact-acceptance]
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch'
    timeout-minutes: 15
    # The solo-maintainer production environment restricts deployments to
    # master. Add an independent reviewer and prevent self-review when a second
    # maintainer exists. The committed intent is documented in rulesets/README.md.
    environment: production
    permissions:
      contents: write
      # Provenance attestation: proves this ZIP was built by this workflow from
      # this commit. The .sha256 sidecar only proves the download was not
      # corrupted — it is written by the same job that writes the ZIP, so it
      # cannot attest origin.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] semantic-release needs this credential
          # to push the verified release tag from this publishing-only job.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # This job holds the pipeline's contents-write token. Dependency lifecycle
      # scripts have no part to play in publishing, so they do not run here.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download theme package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-package
          path: ./

      - name: Semantic Release
        id: semantic_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: pnpm semantic-release

      # semantic-release intentionally leaves the release as a draft. Attest the
      # final bytes before the reconciler verifies and promotes that draft.
      - name: Attest build provenance
        if: ${{ !cancelled() && hashFiles('aggressive-apparel-*.zip') != '' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: aggressive-apparel-*.zip

      # This runs even when semantic-release reports a partial upload failure.
      # It repairs the draft, downloads and verifies the remote bytes, verifies
      # provenance, and only then makes the release visible to the updater.
      - name: Reconcile and publish verified draft
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: bash bin/release/verify-assets.sh

  # ============================================================================
  # Post-release: put the shipped version back into the checkout.
  #
  # package.sh stamps the staged tree and deliberately leaves the repository
  # untouched, so without this master drifts from every release — as it did from
  # 1.181.4 to 1.183.2 before anyone noticed.
  #
  # It opens a pull request rather than pushing: the release-branches ruleset has
  # no bypass actors, and a version header is not worth reinstating one. The
  # commits are created through the GitHub API by create-pull-request's
  # sign-commits, so they are verified and satisfy the ruleset's signature rule
  # without any exemption.
  #
  # Failure here cannot corrupt a release — the release is already published and
  # verified by the time this runs — but it is allowed to fail the run loudly
  # rather than drop the sync silently, because a silent failure is how the
  # drift started.
  # ============================================================================
  version-sync:
    name: 🔖 Sync Theme Version
    runs-on: ubuntu-24.04
    needs: [release-plan, release]
    if: success()
    timeout-minutes: 10
    # The App token below performs the write, so the workflow's own credential
    # only needs to read the tree.
    permissions:
      contents: read

    steps:
      # A pull request opened with GITHUB_TOKEN gets no unattended pipeline run.
      # This one must be validated like any other change to master.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.AA_CI_APP_ID }}
          private-key: ${{ secrets.AA_CI_PRIVATE_KEY }}
          # Scope the token to this job's work. Without these it would inherit
          # the App's entire installation permission set.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the released version into style.css
        env:
          AA_RELEASE_VERSION: ${{ needs.release-plan.outputs.next_version }}
        run: bash bin/release/sync-version.sh

      - name: Open version sync pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          add-paths: style.css
          branch: chore/version-sync
          delete-branch: true
          # chore(release) deliberately: syncing the header must never itself
          # qualify for a release, or merging it would plan the next version.
          commit-message: 'chore(release): sync style.css to ${{ needs.release-plan.outputs.next_version }}'
          title: 'chore(release): sync style.css to ${{ needs.release-plan.outputs.next_version }}'
          body: |
            Automated follow-up to **v${{ needs.release-plan.outputs.next_version }}**.

            `bin/release/package.sh` stamps the version into the distributable ZIP
            and leaves the checkout untouched, so this restores the tracked
            `style.css` header to the version that actually shipped.

            This is not cosmetic: WordPress reads `style.css` as the authoritative
            theme version, and `AGGRESSIVE_APPAREL_VERSION` is a cache-invalidation
            key in `Rendered_Product_Cache`, the Product Collection style
            fingerprint, and five asset enqueues.

            Reproduce locally with:

            ```bash
            bash bin/release/sync-version.sh ${{ needs.release-plan.outputs.next_version }}
            ```

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs:
      [
        changes,
        release-plan,
        dependency-review,
        lint-frontend,
        i18n,
        build,
        test,
        e2e,
        package,
        artifact-acceptance,
        release,
        version-sync,
      ]
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check status
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          SHOULD_RELEASE: ${{ needs.release-plan.outputs.should_release }}
          NEXT_VERSION: ${{ needs.release-plan.outputs.next_version }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEASE_PLAN_RESULT: ${{ needs.release-plan.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          FRONTEND_RESULT: ${{ needs.lint-frontend.result }}
          I18N_RESULT: ${{ needs.i18n.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PHP_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          ARTIFACT_ACCEPTANCE_RESULT: ${{ needs.artifact-acceptance.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          VERSION_SYNC_RESULT: ${{ needs.version-sync.result }}
        run: node bin/ci/release-summary.mjs
