name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEME_SLUG: Aggressive-Apparel
  NODE_VERSION: '24'
  PHP_VERSION: '8.2'

jobs:
  # ============================================================================
  # Detect whether anything OUTSIDE languages/ changed.
  # A translations-only merge (the i18n MT PR) leaves code=false. The two lint
  # jobs gate on this and skip, which cascade-skips build → test → package →
  # release, so the only thing that runs is the cheap i18n catalog check. The
  # merged translations ship with the NEXT code release — its package step
  # recompiles the .mo from whatever .po is on main — so there's no extra
  # version bump for translations. Any code or mixed commit sets code=true and
  # runs the full pipeline.
  # ============================================================================
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` matches when any changed file is outside languages/.
          # `**` selects everything, `!languages/**` removes the catalogs;
          # if nothing remains the diff was translations-only.
          filters: |
            code:
              - '**'
              - '!languages/**'

  # ============================================================================
  # PARALLEL: Release planning.
  #
  # semantic-release intentionally verifies push permission even in dry-run
  # mode. Keep that write-capable token isolated from build and test jobs, run
  # only for trusted pushes to a release branch, and fail closed if planning
  # itself errors. This job runs alongside linting, so it does not extend the
  # pipeline's critical path.
  # ============================================================================
  release-plan:
    name: 🧮 Plan Release
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Lifecycle scripts are unnecessary for release analysis. Disabling them
      # reduces what can execute while this job holds its scoped write token.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  # ============================================================================
  # PARALLEL: Quality Checks (no setup dependency — each job self-caches)
  # ============================================================================
  lint-frontend:
    name: 🔍 Lint & Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check file lengths (no god files)
        run: pnpm lint:files

      - name: Run ESLint
        run: pnpm lint:js

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run Stylelint
        run: pnpm lint:css

      - name: Run Prettier
        run: pnpm format:check

      - name: Run JS tests
        run: pnpm test:js

      # Production-scoped tripwire. The theme ships zero runtime npm deps, so
      # this is clean by construction today and only fails if a *shipped*
      # dependency (added to `dependencies`) carries a high/critical advisory.
      # Dev-tooling advisories (the transitive-noise source) are excluded by
      # --prod and are intentionally not gated here.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  lint-php:
    name: 🔍 Lint PHP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP Syntax Check
        run: find includes/ -name "*.php" -exec php -l {} \; > /dev/null && echo "PHP syntax valid"

      - name: Run PHPCS
        run: composer lint:php

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --verbose

      # Informational: the theme has no runtime PHP dependencies (composer
      # `require` is just php>=8.0), so this only ever reports on dev tooling.
      # Non-blocking so a build-tool advisory can't break a release, but it
      # keeps the advisory visible in the job log.
      - name: Audit PHP dependencies (informational)
        run: composer audit
        continue-on-error: true

  # ============================================================================
  # i18n: POT drift + PO validity + translators-comment lint
  # ============================================================================
  i18n:
    name: 🌐 i18n Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gettext tools
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Install WP-CLI
        run: |
          curl -sS -L -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp
          wp --info --allow-root

      - name: Run i18n check
        env:
          I18N_CI: '1'
        run: bash bin/i18n/check.sh

  # ============================================================================
  # Build Assets. On the translations-only path its lint deps skip, which
  # cascade-skips this job (and test/package/release) — a .po merge never
  # rebuilds. On the code path it runs so tests have artifacts.
  # ============================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-php, i18n]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # ============================================================================
  # PHP tests: All PHPUnit suites in a single wp-env instance.
  # Runs in parallel with the browser E2E job after both consume the same build.
  # ============================================================================
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    # build cascade-skips on the translations-only path, so this 15-min wp-env
    # suite skips with it — no explicit gate needed. Browser tests run in a
    # sibling job so they do not extend this job's critical path.
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, zip, xdebug
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Start wp-env
        run: |
          pnpm env:start
          pnpm wp-env run tests-cli -- wp --info

      - name: Setup theme directory
        run: |
          pnpm wp-env run tests-cli -- bash -c "
            cd /var/www/html/wp-content/themes/
            if [ -d 'Aggressive-Apparel' ] && [ ! -d 'aggressive-apparel' ]; then
              ln -sf Aggressive-Apparel aggressive-apparel
              echo 'Created symlink: Aggressive-Apparel -> aggressive-apparel'
            fi
          "

      - name: Install dependencies in wp-env
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && composer install --no-interaction --prefer-dist"

      - name: Run unit tests (with coverage)
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && ./vendor/bin/phpunit --testsuite=unit --coverage-clover=coverage-unit.xml"

      - name: Run integration tests
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && ./vendor/bin/phpunit --testsuite=integration --verbose"

      - name: Run security tests
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && ./vendor/bin/phpunit --testsuite=security --verbose"

      - name: Run accessibility tests
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && ./vendor/bin/phpunit --testsuite=accessibility --verbose"

      - name: Run performance tests
        run: pnpm wp-env run tests-cli -- bash -c "cd /var/www/html/wp-content/themes/${{ env.THEME_SLUG }} && ./vendor/bin/phpunit --testsuite=performance --verbose"

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage-unit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Browser E2E: Runs beside PHP tests and reuses the build job's artifacts.
  # Invoke Playwright directly so package.json's local pretest:e2e rebuild does
  # not duplicate the build that CI already completed and uploaded.
  # ============================================================================
  e2e:
    name: 🎭 Browser E2E
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Start wp-env
        run: |
          pnpm env:start
          pnpm wp-env run cli -- wp --info

      - name: Run end-to-end tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================================================
  # Package Theme
  # ============================================================================
  package:
    name: 📦 Package Theme
    runs-on: ubuntu-latest
    needs: [release-plan, build, test, e2e]
    if: success() && needs.release-plan.outputs.should_release == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: build/

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Verify build artifacts exist
        run: |
          echo "Checking build artifacts..."
          ls -la build/
          echo "Build artifacts verified"

      - name: Install WP-CLI
        run: |
          curl -sS -L -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /usr/local/bin/wp

      - name: Compile theme translations
        run: bash bin/i18n/compile.sh

      - name: Clean development files
        run: |
          echo "Removing development files..."
          # Remove directories
          rm -rf node_modules src tests .github .husky .vscode bin
          rm -rf docs stubs types vendor

          # Remove lock files
          rm -f pnpm-lock.yaml composer.lock

          # Remove config files
          rm -f webpack.* tsconfig.* eslint.config.js .stylelintrc.json postcss.config.cjs
          rm -f phpunit.xml* phpstan.* phpcs.xml* commitlint.config.mjs .releaserc.json
          rm -f jest.config.mjs lighthouserc.cjs
          rm -f playwright.config.ts pnpm-workspace.yaml page.html

          # Remove AI assistant / dev-only docs
          rm -f CLAUDE.md

          # Remove specific dotfiles
          rm -f .wp-env.json .editorconfig .gitignore .gitattributes

          # Remove dev dependency files
          rm -f package.json composer.json

          echo "Development files removed"

      - name: Create theme package
        run: |
          echo "Creating theme package..."

          # Use lowercase name for WordPress theme directory inside ZIP
          THEME_SLUG_LOWER=$(echo "${{ env.THEME_SLUG }}" | tr '[:upper:]' '[:lower:]')

          # Create temp directory for packaging
          TEMP_DIR="${{ env.THEME_SLUG }}-temp"
          mkdir -p "../${TEMP_DIR}/${THEME_SLUG_LOWER}"

          # Copy all files to temp directory with lowercase directory name
          cp -r * "../${TEMP_DIR}/${THEME_SLUG_LOWER}/"

          # Create zip from temp directory
          cd "../${TEMP_DIR}"
          zip -r "${THEME_SLUG_LOWER}.zip" "${THEME_SLUG_LOWER}" \
            -x "**/.git/*" \
            -x "**/.DS_Store" \
            -x "**/Thumbs.db"

          # Move zip back to original directory
          mv "${THEME_SLUG_LOWER}.zip" "../${{ env.THEME_SLUG }}/"

          # Clean up temp directory
          cd ..
          rm -rf "${TEMP_DIR}"

          # Return to theme directory
          cd ${{ env.THEME_SLUG }}

          echo "Package created: $(ls -lh aggressive-apparel.zip)"

      - name: Verify development files are excluded
        run: |
          FORBIDDEN_PATTERNS=(
            'lighthouserc\.cjs'
            '/tests/'
            '/docs/'
            '/stubs/'
            '/types/'
            '/vendor/'
            '/\.wp-env\.json$'
            'playwright\.config\.ts'
            'pnpm-workspace\.yaml'
            # Root-anchored: the packaging step rm's a stray root-level
            # page.html. An unanchored '/page\.html' also matches
            # templates/page.html — a required FSE template that must ship.
            'aggressive-apparel/page\.html$'
          )
          ZIP_LIST=$(unzip -l aggressive-apparel.zip)
          FAILED=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if echo "$ZIP_LIST" | grep -qE "$pattern"; then
              echo "Forbidden path matching ${pattern} must not be included in the release package"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo "Development files are excluded"

      - name: Upload theme package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.THEME_SLUG }}-package
          path: aggressive-apparel.zip
          retention-days: 30

  # ============================================================================
  # Release (Only on main/master)
  # ============================================================================
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [package]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download theme package
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.THEME_SLUG }}-package
          path: ./

      - name: Verify package exists
        run: |
          echo "Verifying package..."
          ls -lh aggressive-apparel.zip
          echo "Package verified"

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: pnpm semantic-release

      # A flaky asset upload can publish a release whose .sha256 sidecar is
      # missing, which stops Core\Theme_Updates offering the update to any
      # site. Re-upload and fail loudly rather than ship that silently.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/release/verify-assets.sh

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [release-plan, lint-frontend, lint-php, i18n, build, test, e2e, package]
    if: always()

    steps:
      - name: Check status
        run: |
          echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if this was a release-worthy commit
          RELEASE_PLAN_RESULT="${{ needs.release-plan.result }}"
          SHOULD_RELEASE="${{ needs.release-plan.outputs.should_release }}"
          NEXT_VERSION="${{ needs.release-plan.outputs.next_version }}"
          if [ "$RELEASE_PLAN_RESULT" = "failure" ] || [ "$RELEASE_PLAN_RESULT" = "cancelled" ]; then
            echo "**Release planning failed** — Packaging and release were blocked" >> $GITHUB_STEP_SUMMARY
          elif [ "$SHOULD_RELEASE" = "true" ]; then
            echo "**Release v${NEXT_VERSION} planned** — Full pipeline (incl. packaging) executed" >> $GITHUB_STEP_SUMMARY
          elif [ "$RELEASE_PLAN_RESULT" = "success" ]; then
            echo "**Non-release commit** — Quality checks, build and tests executed (packaging skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release planning skipped** — This event is not a release-branch code push" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release planning | ${{ needs.release-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (ESLint + Stylelint + Prettier + JS Tests) | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP Lint (syntax + PHPCS + PHPStan) | ${{ needs.lint-php.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i18n (POT drift + catalogs) | ${{ needs.i18n.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests (unit + integration + security + a11y + perf) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "| Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package | skipped (non-release) |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.lint-frontend.result }}" = "success" ] && \
             [ "${{ needs.lint-php.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Quality checks, build and tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
