name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  # develop is included so integration PRs are gated by the same checks as the
  # release branches; pushing to develop already ran them, so a PR into it was
  # the only unguarded path into the tree.
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR pushes are cancelled, but a run on a release branch is never
# cancelled. semantic-release's publish is not atomic — it pushes the tag and
# release commit, creates the GitHub release, then uploads assets. Cancelling
# inside that window leaves a published release with missing assets, which
# bin/release/verify-assets.sh exists to repair but cannot, because the
# cancellation kills that step too and the existing tag stops semantic-release
# from ever reaching the upload again on a re-run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24.18.0'

jobs:
  # ============================================================================
  # Detect whether anything OUTSIDE languages/ changed.
  # A translations-only merge (the i18n MT PR) leaves code=false. The frontend
  # job gates on this and skips, which cascade-skips build → test → package →
  # release, so the only required check is the canonical i18n lane. The
  # merged translations ship with the NEXT code release — its package step
  # recompiles the .mo from whatever .po is on main — so there's no extra
  # version bump for translations. Any code or mixed commit sets code=true and
  # runs the full pipeline.
  # ============================================================================
  changes:
    name: 🧭 Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `code` matches when any changed file is outside languages/.
          # `**` selects everything, `!languages/**` removes the catalogs;
          # if nothing remains the diff was translations-only.
          filters: |
            code:
              - '**'
              - '!languages/**'

  # ============================================================================
  # PARALLEL: Release planning.
  #
  # semantic-release intentionally verifies push permission even in dry-run
  # mode. Keep that write-capable token isolated from build and test jobs, run
  # only for trusted pushes to a release branch, and fail closed if planning
  # itself errors. This job runs alongside linting, so it does not extend the
  # pipeline's critical path.
  # ============================================================================
  release-plan:
    name: 🧮 Plan Release
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      release_type: ${{ steps.check.outputs.release_type }}
      next_version: ${{ steps.check.outputs.next_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Lifecycle scripts are unnecessary for release analysis. Disabling them
      # reduces what can execute while this job holds its scoped write token.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Determine release
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0'
        run: node bin/release/plan.mjs

  # ============================================================================
  # PARALLEL: Quality Checks (no setup dependency — each job self-caches)
  # ============================================================================
  lint-frontend:
    name: 🔍 Lint & Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical frontend lane
        run: pnpm ci:frontend

  # ============================================================================
  # Supply chain: block a pull request that introduces a dependency with a known
  # advisory, before it reaches the tree. `pnpm audit` in the frontend lane only
  # sees what is already installed; this reviews the diff itself.
  # ============================================================================
  dependency-review:
    name: 🛡️ Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ============================================================================
  # i18n: POT drift + PO validity + translators-comment lint
  # ============================================================================
  i18n:
    name: 🌐 i18n Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical i18n lane
        run: pnpm ci:i18n

  # ============================================================================
  # Build Assets. On the translations-only path its lint deps skip, which
  # cascade-skips this job (and test/package/release) — a .po merge never
  # rebuilds. On the code path it runs so tests have artifacts.
  # ============================================================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: [lint-frontend, i18n]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical build lane
        run: pnpm ci:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # ============================================================================
  # PHP quality + tests: syntax, PHPCS, PHPStan and every PHPUnit suite run in
  # the same committed PHP 8.2 wp-env lane locally and in Actions.
  # Runs in parallel with the browser E2E job after both consume the same build.
  # ============================================================================
  test:
    name: 🧪 PHP Quality & Tests
    runs-on: ubuntu-latest
    # build cascade-skips on the translations-only path, so this 15-min wp-env
    # suite skips with it — no explicit gate needed. Browser tests run in a
    # sibling job so they do not extend this job's critical path.
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Run canonical PHP lane
        run: pnpm ci:php

      # Reporting only — the PHP lane above is the gate. A Codecov outage or a
      # missing token on a fork PR must not fail a run whose tests all passed.
      - name: Upload coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage-unit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # Browser E2E: Runs beside PHP tests and reuses the build job's artifacts.
  # The shared CI lane avoids the public local E2E command's rebuild because the
  # build job already produced and uploaded the exact assets under test.
  # ============================================================================
  e2e:
    name: 🎭 Browser E2E
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile bump usually does not change the browser build, so fall
          # back to the most recent cache instead of re-downloading Chromium.
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Run end-to-end tests
        run: pnpm ci:e2e

      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================================================
  # Package Theme
  # ============================================================================
  package:
    name: 📦 Package Theme
    runs-on: ubuntu-latest
    needs: [release-plan, build, test, e2e]
    if: success() && needs.release-plan.outputs.should_release == 'true'
    # Matches the `test` job: this lane also brings up wp-env from cold to
    # compile catalogs with the pinned WP-CLI.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: build/

      # Compiles catalogs, builds the ZIP from the allowlist in
      # bin/release/lib.sh, then asserts contents, exclusions, catalogs and
      # headers. Identical to what `pnpm qa` runs locally.
      - name: Run canonical package lane
        run: pnpm ci:package

      - name: Upload theme package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-package
          path: aggressive-apparel.zip
          retention-days: 30

  # ============================================================================
  # Release (Only on main/master)
  # ============================================================================
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [package]
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    timeout-minutes: 10
    # Deliberately declared WITHOUT required reviewers, so release cadence is
    # unchanged: merging to a release branch still publishes. What this buys is
    # a deployment record per release, environment-scoped secrets, and a single
    # switch to turn on manual approval later without touching this workflow.
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Provenance attestation: proves this ZIP was built by this workflow from
      # this commit. The .sha256 sidecar only proves the download was not
      # corrupted — it is written by the same job that writes the ZIP, so it
      # cannot attest origin.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # This job holds the widest token in the pipeline (contents, issues and
      # pull-requests write). Dependency lifecycle scripts have no part to play
      # in publishing, so they do not run here — matching the same hardening
      # already applied to the release-plan job.
      - name: Install release tooling
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download theme package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-package
          path: ./

      # prepare.sh re-runs the full package verification against the versioned
      # artifact before it is checksummed and uploaded.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0
        run: pnpm semantic-release

      # A flaky asset upload can publish a release whose .sha256 sidecar is
      # missing, which stops Core\Theme_Updates offering the update to any
      # site. Re-upload and fail loudly rather than ship that silently.
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash bin/release/verify-assets.sh

      # Runs after the assets are confirmed present, and attests the versioned
      # ZIP that prepare.sh actually produced. Guarded on the file existing so a
      # run that published nothing cannot fail here.
      - name: Attest build provenance
        if: hashFiles('aggressive-apparel-*.zip') != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: aggressive-apparel-*.zip

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        release-plan,
        dependency-review,
        lint-frontend,
        i18n,
        build,
        test,
        e2e,
        package,
        release,
      ]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check status
        run: |
          echo "## CI/CD Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if this was a release-worthy commit
          RELEASE_PLAN_RESULT="${{ needs.release-plan.result }}"
          SHOULD_RELEASE="${{ needs.release-plan.outputs.should_release }}"
          NEXT_VERSION="${{ needs.release-plan.outputs.next_version }}"
          CODE_CHANGED="${{ needs.changes.outputs.code }}"
          if [ "$RELEASE_PLAN_RESULT" = "failure" ] || [ "$RELEASE_PLAN_RESULT" = "cancelled" ]; then
            echo "**Release planning failed** — Packaging and release were blocked" >> $GITHUB_STEP_SUMMARY
          elif [ "$SHOULD_RELEASE" = "true" ]; then
            echo "**Release v${NEXT_VERSION} planned** — Full pipeline (incl. packaging) executed" >> $GITHUB_STEP_SUMMARY
          elif [ "$RELEASE_PLAN_RESULT" = "success" ]; then
            echo "**Non-release commit** — Quality checks, build and tests executed (packaging skipped)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release planning skipped** — This event is not a release-branch code push" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Release planning | ${{ needs.release-plan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend (ESLint + Stylelint + Prettier + JS Tests) | ${{ needs.lint-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| i18n (POT drift + catalogs) | ${{ needs.i18n.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PHP (syntax + PHPCS + PHPStan + PHPUnit) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "$SHOULD_RELEASE" = "true" ]; then
            echo "| Package | ${{ needs.package.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Release (publish + assets + provenance) | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Package | skipped (non-release) |" >> $GITHUB_STEP_SUMMARY
            echo "| Release | skipped (non-release) |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "| Dependency review | ${{ needs.dependency-review.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          FAILED=0
          require_success() {
            local label="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::Required ${label} job concluded ${result}"
              FAILED=1
            fi
          }

          require_success "change detection" "${{ needs.changes.result }}"
          require_success "i18n" "${{ needs.i18n.result }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            require_success "dependency review" "${{ needs.dependency-review.result }}"
          fi

          if [ "$CODE_CHANGED" = "true" ]; then
            require_success "frontend" "${{ needs.lint-frontend.result }}"
            require_success "build" "${{ needs.build.result }}"
            require_success "PHP" "${{ needs.test.result }}"
            require_success "browser E2E" "${{ needs.e2e.result }}"

            if [ "${{ github.event_name }}" = "push" ] && \
               { [ "${{ github.ref }}" = "refs/heads/main" ] || \
                 [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
              require_success "release planning" "$RELEASE_PLAN_RESULT"
            fi

            if [ "$SHOULD_RELEASE" = "true" ]; then
              require_success "package" "${{ needs.package.result }}"

              # The release job publishes the tag, uploads the assets, verifies
              # them and attests provenance. Without this the aggregate gate
              # could report success on a run whose publish step failed.
              if [ "${{ needs.release.result }}" != "skipped" ]; then
                require_success "release" "${{ needs.release.result }}"
              fi
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" -ne 0 ]; then
            echo "### Required CI gate failed." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "### Required CI gate passed." >> $GITHUB_STEP_SUMMARY
