name: WordPress Beta Compatibility

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wordpress-beta-compatibility
  cancel-in-progress: true

env:
  NODE_VERSION: '24.18.0'
  PHP_VERSION: '8.2.32'

jobs:
  e2e:
    name: 🧪 Latest WordPress Beta/RC
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          pnpm install --frozen-lockfile

      - name: Build theme
        run: pnpm ci:build

      - name: Install Playwright browser
        run: pnpm test:e2e:install

      - name: Start latest Beta/RC environment
        run: |
          pnpm env:start
          pnpm env:check

      - name: Run end-to-end compatibility suite
        run: pnpm ci:e2e:beta

      - name: Upload Playwright diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wordpress-beta-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
