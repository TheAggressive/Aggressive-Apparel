packages: []

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  fs-ext: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: false

# Security overrides for transitive devDependencies (GitHub advisories).
# These MUST live here, not in package.json's `pnpm.overrides`: with a
# pnpm-workspace.yaml present, pnpm 10+ reads overrides from this file and
# silently ignores the package.json field.
#
# Caret-pinned so a fix cannot drag in a major: `>=3.3.4` resolved svgo 4.0.2.
# Patch-level only — same major as what the tree already resolves, so no API
# break. linkify-it and webpack-dev-server are deliberately absent: their fixes
# require major bumps to @wordpress/scripts' chain, and neither code path
# (markdownlint, webpack serve) is ever executed by this project.
overrides:
  brace-expansion: '^1.1.16'
  immutable: '^5.1.8'
  'js-yaml@<4': '^3.15.0'
  'js-yaml@>=4': '^4.3.0'
  svgo: '^3.3.4'
