packages: []

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  core-js-pure: false
  fs-ext: false
  fs-ext-extra-prebuilt: false
  unrs-resolver: false

# Security overrides for transitive devDependencies (GitHub advisories).
#
# These MUST live here, not in package.json's `pnpm.overrides`: with a
# pnpm-workspace.yaml present, pnpm 10+ reads overrides from this file and
# silently ignores the package.json field.
#
# Pin within the major each consumer declares. An unscoped range crosses
# majors for some consumer and breaks it: `>=3.3.4` pulled svgo 4, and an
# unscoped brace-expansion `^1` breaks minimatch 9/10, which declare ^2 and ^5
# and call the named `expand` export that 1.x does not have.
overrides:
  # Only minimatch@3 pulls the vulnerable 1.x line; 2.x and 5.x are unaffected.
  'brace-expansion@1': '^1.1.16'
  immutable: '^5.1.8'
  'js-yaml@<4': '^3.15.0'
  'js-yaml@>=4': '^4.3.0'
  svgo: '^3.3.4'

  # Moved from package.json's `pnpm.overrides`, where it had never applied —
  # lighthouse was resolving to 12.x despite the 13.4.0 pin. Not used by any
  # ci:* lane, so it only affects a manual Lighthouse run.
  '@lhci/cli>lighthouse': '13.4.0'

  # These two cross majors, which is safe only because neither code path runs
  # here: linkify-it arrives via markdownlint (markdown is linted with
  # Prettier) and webpack-dev-server via `serve` (builds use wp-scripts build
  # and watch). The build and test lanes verify nothing else depended on them.
  linkify-it: '^5.0.2'
  webpack-dev-server: '^5.2.6'
